name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: bun run lint

      - name: Typecheck files
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: bun run test --maxWorkers=2 --coverage

  skia-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: '@shopify/react-native-skia'
            version: '1'
          - package: '@shopify/react-native-skia'
            version: '2.14.0'
          - package: react-native-skia
            version: '2'
          - package: react-native-skia
            version: '3'
    name: skia-compat (${{ matrix.package }}@${{ matrix.version }})
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check Skia API compatibility
        run: scripts/check-skia-types.sh '${{ matrix.package }}' '${{ matrix.version }}'

  build-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: bun run prepare
